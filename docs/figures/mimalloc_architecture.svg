<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">mimalloc-like allocator principle diagram</title>
  <desc id="desc">Structural diagram showing mimalloc-like heaps, owned pages, local free lists, and remote free queues.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.panel{fill:#f8fbfe;stroke:#1f3348;stroke-width:2.4;rx:22}.sub{fill:#fff;stroke:#526a82;stroke-width:2;rx:16}
      .blue{fill:#e5f0ff;stroke:#1d5fa8}.warm{fill:#fff2dc;stroke:#a86d18}.green{fill:#ecfaef;stroke:#357a46}.gray{fill:#f4f6f8;stroke:#6c7d8f}
      .title{font:700 36px Arial,sans-serif;fill:#172331}.subtitle{font:500 22px Arial,sans-serif;fill:#536579}
      .h{font:700 24px Arial,sans-serif;fill:#172331}.t{font:500 18px Arial,sans-serif;fill:#33485d}.s{font:500 16px Arial,sans-serif;fill:#536579}
      .note{font:700 18px Arial,sans-serif;fill:#1d5fa8}.line{stroke:#9aacbd;stroke-width:2;fill:none}.slot{fill:#e5f0ff;stroke:#1d5fa8;stroke-width:1.6;rx:6}
    </style>
  </defs>
  <rect class="bg" width="1400" height="920"/>
  <text class="title" x="60" y="62">mimalloc-like allocator: heap ownership and remote free</text>
  <text class="subtitle" x="60" y="98">This is a structure diagram: every page has an owner; remote frees are owner-visible.</text>

  <rect class="panel" x="60" y="130" width="1280" height="700"/>

  <rect class="sub" x="92" y="180" width="360" height="420"/>
  <text class="h" x="120" y="220">Owner heap</text>
  <rect class="blue" x="120" y="270" width="260" height="62" rx="12"/><text class="t" x="150" y="308">thread-local heap id</text>
  <rect class="green" x="120" y="370" width="260" height="62" rx="12"/><text class="t" x="150" y="408">page ownership table</text>
  <text class="s" x="120" y="500">ownership decides where frees land</text>

  <rect class="sub" x="502" y="180" width="430" height="420"/>
  <text class="h" x="530" y="220">Owned page layout</text>
  <rect class="green" x="530" y="270" width="340" height="80" rx="12"/>
  <text class="t" x="560" y="302">page metadata</text>
  <text class="s" x="560" y="326">owner_heap, size_class, capacity</text>
  <rect class="blue" x="530" y="382" width="150" height="58" rx="12"/><text class="t" x="558" y="418">local list</text>
  <rect class="warm" x="720" y="382" width="150" height="58" rx="12"/><text class="t" x="748" y="418">remote list</text>
  <g transform="translate(530 484)">
    <rect class="slot" x="0" y="0" width="38" height="30"/><rect class="slot" x="50" y="0" width="38" height="30"/>
    <rect class="slot" x="100" y="0" width="38" height="30"/><rect class="slot" x="150" y="0" width="38" height="30"/>
    <rect class="slot" x="200" y="0" width="38" height="30"/><rect class="slot" x="250" y="0" width="38" height="30"/>
  </g>

  <rect class="sub" x="982" y="180" width="324" height="420"/>
  <text class="h" x="1010" y="220">Cross-thread case</text>
  <rect class="warm" x="1010" y="274" width="240" height="62" rx="12"/><text class="t" x="1040" y="312">non-owner free</text>
  <rect class="warm" x="1010" y="374" width="240" height="62" rx="12"/><text class="t" x="1040" y="412">atomic remote list</text>
  <rect class="gray" x="1010" y="474" width="240" height="62" rx="12"/><text class="t" x="1040" y="512">segment / mmap</text>
  <text class="s" x="1010" y="578">owner later drains remote list</text>

  <path class="line" d="M452 390H502"/><path class="line" d="M932 390H982"/>

  <rect class="panel" x="60" y="860" width="1280" height="44"/>
  <text class="note" x="92" y="890">Key idea: ownership prevents remote frees from corrupting the freeing thread's local cache.</text>
</svg>

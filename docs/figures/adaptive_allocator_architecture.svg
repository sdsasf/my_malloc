<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive allocator principle diagram</title>
  <desc id="desc">Structural diagram showing adaptive allocator metadata, shared substrate, mode policy table, telemetry selector, and soft-switch invariant.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.panel{fill:#f8fbfe;stroke:#1f3348;stroke-width:2.4;rx:22}.sub{fill:#fff;stroke:#526a82;stroke-width:2;rx:16}
      .blue{fill:#e5f0ff;stroke:#1d5fa8}.warm{fill:#fff2dc;stroke:#a86d18}.green{fill:#ecfaef;stroke:#357a46}.gray{fill:#f4f6f8;stroke:#6c7d8f}
      .red{fill:#fff0ef;stroke:#b94538}.title{font:700 36px Arial,sans-serif;fill:#172331}.subtitle{font:500 22px Arial,sans-serif;fill:#536579}
      .h{font:700 24px Arial,sans-serif;fill:#172331}.t{font:500 18px Arial,sans-serif;fill:#33485d}.s{font:500 16px Arial,sans-serif;fill:#536579}
      .note{font:700 18px Arial,sans-serif;fill:#1d5fa8}.line{stroke:#9aacbd;stroke-width:2;fill:none}.cell{fill:#fff;stroke:#1d5fa8;stroke-width:1.6;rx:6}
    </style>
  </defs>
  <rect class="bg" width="1400" height="980"/>
  <text class="title" x="60" y="62">Adaptive allocator: shared substrate plus mode policies</text>
  <text class="subtitle" x="60" y="98">This is a structure diagram: mode switching changes policy state, not allocator ownership.</text>

  <rect class="panel" x="60" y="130" width="1280" height="730"/>

  <rect class="sub" x="92" y="180" width="360" height="300"/>
  <text class="h" x="120" y="220">AdaptiveHeader</text>
  <text class="s" x="120" y="248">allocation-time metadata</text>
  <rect class="blue" x="120" y="282" width="116" height="40" rx="8"/><text class="s" x="144" y="308">magic</text>
  <rect class="warm" x="252" y="282" width="150" height="40" rx="8"/><text class="s" x="276" y="308">mode_id</text>
  <rect class="gray" x="120" y="338" width="116" height="40" rx="8"/><text class="s" x="142" y="364">storage</text>
  <rect class="gray" x="252" y="338" width="150" height="40" rx="8"/><text class="s" x="276" y="364">owner_thread</text>
  <rect class="green" x="120" y="394" width="282" height="40" rx="8"/><text class="s" x="150" y="420">requested / usable / mapped</text>

  <rect class="sub" x="502" y="180" width="390" height="300"/>
  <text class="h" x="530" y="220">Adaptive mode table</text>
  <text class="s" x="530" y="248">modes emit plans, not memory operations</text>
  <g transform="translate(530 282)">
    <rect class="warm" x="0" y="0" width="150" height="38" rx="8"/><text class="s" x="22" y="25">Balanced</text>
    <rect class="warm" x="170" y="0" width="150" height="38" rx="8"/><text class="s" x="188" y="25">Throughput</text>
    <rect class="warm" x="0" y="54" width="150" height="38" rx="8"/><text class="s" x="20" y="79">CompactRSS</text>
    <rect class="warm" x="170" y="54" width="150" height="38" rx="8"/><text class="s" x="190" y="79">CrossThread</text>
    <rect class="warm" x="0" y="108" width="150" height="38" rx="8"/><text class="s" x="24" y="133">LargeObject</text>
    <rect class="warm" x="170" y="108" width="150" height="38" rx="8"/><text class="s" x="204" y="133">Debug</text>
  </g>
  <rect class="gray" x="530" y="444" width="150" height="38" rx="8"/><text class="s" x="556" y="469">AllocationPlan</text>
  <rect class="gray" x="712" y="444" width="150" height="38" rx="8"/><text class="s" x="732" y="469">ReleaseDecision</text>

  <rect class="sub" x="942" y="180" width="364" height="300"/>
  <text class="h" x="970" y="220">Telemetry selector</text>
  <text class="s" x="970" y="248">windowed feature extraction</text>
  <rect class="green" x="970" y="282" width="278" height="44" rx="10"/><text class="s" x="998" y="310">size / lifetime / thread profile</text>
  <rect class="green" x="970" y="344" width="278" height="44" rx="10"/><text class="s" x="998" y="372">RSS / fragmentation / slow path</text>
  <rect class="green" x="970" y="406" width="278" height="44" rx="10"/><text class="s" x="998" y="434">offline-trained cost model</text>

  <rect class="sub" x="92" y="540" width="1214" height="248"/>
  <text class="h" x="120" y="580">Shared Memory Management Layer</text>
  <text class="s" x="120" y="608">one substrate shared by every mode</text>
  <rect class="blue" x="120" y="646" width="182" height="68" rx="12"/><text class="t" x="148" y="674">Size-class</text><text class="s" x="148" y="696">pages</text>
  <rect class="blue" x="336" y="646" width="182" height="68" rx="12"/><text class="t" x="364" y="674">Spans</text><text class="s" x="364" y="696">medium</text>
  <rect class="blue" x="552" y="646" width="182" height="68" rx="12"/><text class="t" x="580" y="674">Extents</text><text class="s" x="580" y="696">large/direct</text>
  <rect class="green" x="768" y="646" width="182" height="68" rx="12"/><text class="t" x="796" y="674">TLS cache</text><text class="s" x="796" y="696">batch reuse</text>
  <rect class="green" x="984" y="646" width="182" height="68" rx="12"/><text class="t" x="1012" y="674">Remote queue</text><text class="s" x="1012" y="696">owner drain</text>
  <rect class="warm" x="1200" y="646" width="76" height="68" rx="12"/><text class="s" x="1216" y="676">OS</text><text class="s" x="1216" y="696">map</text>
  <g transform="translate(120 748)">
    <rect class="cell" x="0" y="0" width="82" height="30"/><rect class="cell" x="96" y="0" width="82" height="30"/>
    <rect class="cell" x="192" y="0" width="82" height="30"/><rect class="cell" x="288" y="0" width="82" height="30"/>
    <rect class="cell" x="384" y="0" width="82" height="30"/><rect class="cell" x="480" y="0" width="82" height="30"/>
    <text class="s" x="602" y="22">physical pages, spans, direct mappings, retained regions</text>
  </g>

  <path class="line" d="M452 330H502"/><path class="line" d="M892 330H942"/><path class="line" d="M700 480V540"/>
  <rect class="panel" x="60" y="890" width="1280" height="44"/>
  <text class="note" x="92" y="920">Soft-switch invariant: malloc uses active mode; free/realloc use header.mode_id; live objects never migrate.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">jemalloc-like allocator principle diagram</title>
  <desc id="desc">Structural diagram showing jemalloc-like arenas, bins, runs, tcaches, and extent backend.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.panel{fill:#f8fbfe;stroke:#1f3348;stroke-width:2.4;rx:22}.sub{fill:#fff;stroke:#526a82;stroke-width:2;rx:16}
      .blue{fill:#e5f0ff;stroke:#1d5fa8}.warm{fill:#fff2dc;stroke:#a86d18}.green{fill:#ecfaef;stroke:#357a46}.gray{fill:#f4f6f8;stroke:#6c7d8f}
      .title{font:700 36px Arial,sans-serif;fill:#172331}.subtitle{font:500 22px Arial,sans-serif;fill:#536579}
      .h{font:700 24px Arial,sans-serif;fill:#172331}.t{font:500 18px Arial,sans-serif;fill:#33485d}.s{font:500 16px Arial,sans-serif;fill:#536579}
      .note{font:700 18px Arial,sans-serif;fill:#1d5fa8}.line{stroke:#9aacbd;stroke-width:2;fill:none}.slot{fill:#e5f0ff;stroke:#1d5fa8;stroke-width:1.6;rx:6}
    </style>
  </defs>
  <rect class="bg" width="1400" height="920"/>
  <text class="title" x="60" y="62">jemalloc-like allocator: arenas, bins, runs, extents</text>
  <text class="subtitle" x="60" y="98">This is a structure diagram: arenas partition state; runs hold same-size slots.</text>

  <rect class="panel" x="60" y="130" width="1280" height="700"/>

  <rect class="sub" x="92" y="180" width="280" height="420"/>
  <text class="h" x="120" y="220">Thread front end</text>
  <rect class="green" x="120" y="270" width="210" height="62" rx="12"/><text class="t" x="150" y="308">per-thread tcache</text>
  <rect class="blue" x="120" y="370" width="210" height="62" rx="12"/><text class="t" x="150" y="408">arena assignment</text>
  <text class="s" x="120" y="500">threads map onto arenas</text>
  <text class="s" x="120" y="526">to reduce global contention</text>

  <rect class="sub" x="422" y="180" width="540" height="420"/>
  <text class="h" x="450" y="220">Arena-local layout</text>
  <text class="s" x="450" y="248">each arena owns bins and non-full runs</text>
  <g transform="translate(450 292)">
    <rect class="blue" x="0" y="0" width="140" height="54" rx="10"/><text class="t" x="30" y="34">bin 16B</text>
    <rect class="blue" x="168" y="0" width="140" height="54" rx="10"/><text class="t" x="198" y="34">bin 32B</text>
    <rect class="blue" x="336" y="0" width="140" height="54" rx="10"/><text class="t" x="370" y="34">bin ...</text>
  </g>
  <rect class="green" x="450" y="400" width="476" height="126" rx="14"/>
  <text class="h" x="480" y="436">Run</text>
  <text class="s" x="480" y="462">page-sized region carved into one size class</text>
  <g transform="translate(670 430)">
    <rect class="slot" x="0" y="0" width="40" height="32"/><rect class="slot" x="52" y="0" width="40" height="32"/>
    <rect class="slot" x="104" y="0" width="40" height="32"/><rect class="slot" x="156" y="0" width="40" height="32"/>
    <rect class="slot" x="208" y="0" width="40" height="32"/><rect class="slot" x="260" y="0" width="40" height="32"/>
  </g>

  <rect class="sub" x="1012" y="180" width="294" height="420"/>
  <text class="h" x="1040" y="220">Extent backend</text>
  <rect class="warm" x="1040" y="274" width="218" height="58" rx="12"/><text class="t" x="1070" y="310">active extents</text>
  <rect class="warm" x="1040" y="358" width="218" height="58" rx="12"/><text class="t" x="1070" y="394">dirty / retained</text>
  <rect class="gray" x="1040" y="442" width="218" height="58" rx="12"/><text class="t" x="1070" y="478">large extents</text>
  <text class="s" x="1040" y="552">teaching version simplifies</text>
  <text class="s" x="1040" y="578">production decay states</text>

  <path class="line" d="M372 390H422"/><path class="line" d="M962 390H1012"/>

  <rect class="panel" x="60" y="860" width="1280" height="44"/>
  <text class="note" x="92" y="890">Key idea: arenas isolate contention; runs organize same-size objects inside each arena.</text>
</svg>
